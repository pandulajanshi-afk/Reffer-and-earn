<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
      <h1 class="title">Hello World! </h1>
      <p id="currentTime"></p>
      <script src="script.js"></script>
  </body>
</htmlbody {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f9f9f9;
  color: #333;
  text-align: center;
}

header {
  background: #4CAF50;
  color: white;
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
}

.hero {
  padding: 50px 20px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.hero h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 20px;
}

.btn {
  background: #4CAF50;
  color: white;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}

.section {
  padding: 40px 20px;
  background: #fff;
  margin: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.section h2 {
  margin-bottom: 20px;
}

.steps {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

@media (min-width: 768px) {
  .steps { flex-direction: row; justify-content: center; }
  .step { flex: 1; }
}

.step {
  background: #f1f1f1;
  padding: 20px;
  border-radius: 8px;
}

footer {
  background: #333;
  color: #fff;
  padding: 15px;
  font-size: 14px;
}
